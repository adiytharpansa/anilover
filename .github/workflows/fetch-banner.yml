name: Fetch AniList Banner
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Query AniList and download images
        run: |
          set -x
          curl -s -X POST https://graphql.anilist.co -H "Content-Type: application/json" \
            -d '{"query":"{ Media(id:172463){ bannerImage coverImage{extraLarge large} } }"}' -o media.json
          cat media.json
          BANNER=$(python3 -c "import json;d=json.load(open('media.json'));print(d['data']['Media']['bannerImage'] or '')")
          COVER=$(python3 -c "import json;d=json.load(open('media.json'));m=d['data']['Media']['coverImage'];print(m['extraLarge'] or m['large'] or '')")
          echo "banner url: $BANNER"
          echo "cover url: $COVER"
          if [ -n "$BANNER" ]; then curl -sL -A "Mozilla/5.0" "$BANNER" -o bannerImage.jpg; fi
          if [ -n "$COVER" ]; then curl -sL -A "Mozilla/5.0" "$COVER" -o coverExtraLarge.jpg; fi
          ls -la
          file bannerImage.jpg coverExtraLarge.jpg || true
      - uses: actions/upload-artifact@v4
        with:
          name: jjk-s3-images
          path: |
            media.json
            bannerImage.jpg
            coverExtraLarge.jpg
          if-no-files-found: warn
