name: Release APK

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: gradle assembleRelease --stacktrace
        env:
          CATALOG_KEY: ${{ secrets.CATALOG_KEY }}

      - name: Get version from gradle
        id: version
        run: |
          VERSION=$(grep "versionName =" app/build.gradle.kts | grep -oP '"\K[^"]+')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk "Anilover-${{ steps.version.outputs.VERSION }}.apk"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "Anilover-*.apk"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
