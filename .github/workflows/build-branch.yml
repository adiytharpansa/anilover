name: Build APK (branch)
# Dipakai untuk membangun APK dari branch kerja (mis. arena/*) tanpa harus merge ke main.
# Push ke branch ini otomatis menjalankan build; bisa juga dijalankan manual via workflow_dispatch.
on:
  push:
    branches: [arena/6ccedc94-anilover]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build-log.txt
        env:
          CATALOG_KEY: ${{ secrets.CATALOG_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Anilover-branch-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            build-log.txt
          if-no-files-found: ignore
